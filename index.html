<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>我在希腊蹬随机的句子。</title>
  
  <link rel="stylesheet" href="css/tokens.css?v=35">
  <link rel="stylesheet" href="css/base.css?v=35">
  <link rel="stylesheet" href="css/gallery.css?v=35">
  <link rel="stylesheet" href="css/animations.css?v=35">
</head>
<body class="teleprompter-locked">

  <!-- 3秒丝滑淡出卷首题记 (Splash Intro, 固定居中不滚动) -->
  <div id="hero-splash" class="hero-splash-overlay">
    <div class="hero-tag-wrap en-text">
      <span class="hero-greek-sub">ΤΥΧΑΙΕΣ ΠΡΟΤΑΣΕΙΣ ΣΤΗΝ ΕΛΛΑΔΑ</span>
      <span class="hero-divider">·</span>
      <span class="hero-coord">37°58'N 23°43'E</span>
    </div>
    <h1 class="hero-main-title">我在希腊蹬随机的句子。</h1>
    <div class="hero-meta-line en-text">
      <span>AUTONOMOUS DISCOURSE GENERATOR · SmolLM2 × MarianMT</span>
    </div>
    <div class="hero-separator"></div>
  </div>

  <!-- 42vw 巨型半透明背景水印 -->
  <div class="watermark-number en-text" id="watermark-bg">Ω</div>

  <!-- 纵向无尽平滑滚动流视口 (顶部与底部带有电影级渐隐遮罩) -->
  <main class="teleprompter-viewport">
    <div class="teleprompter-track" id="teleprompter-track">
      <!-- 动态字块持续从下方平滑涌出并向上匀速滚动 -->
    </div>
  </main>

  <!-- 右下角极简遥测日志指示器与抽屉 -->
  <div class="telemetry-widget">
    <button id="telemetry-toggle-btn" class="telemetry-btn en-text" title="Toggle Telemetry Logs">
      <span class="telemetry-dot"></span>
      <span id="telemetry-status-summary">STREAM: ACTIVE</span>
    </button>
    <div id="telemetry-drawer" class="telemetry-drawer en-text">
      <div class="telemetry-header">
        <span>SYSTEM TELEMETRY LOGS</span>
        <span id="telemetry-close-btn" class="telemetry-close">✕</span>
      </div>
      <div class="telemetry-stage-bar">
        <span id="telemetry-stage-name">STAGE: INITIALIZING</span>
        <span id="telemetry-stage-pct">0%</span>
      </div>
      <div class="telemetry-progress-line">
        <div id="telemetry-bar-fill" class="telemetry-bar-fill" style="width: 0%;"></div>
      </div>
      <div id="telemetry-logs-list" class="telemetry-logs-list">
        <!-- 实时日志行 -->
      </div>
    </div>
  </div>

  <script type="module" src="js/gallery.js?v=seamless_v37"></script>
</body>
</html>
