<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我在希腊蹬随机的句子 · 24H 流式长文艺术装置</title>
  
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- 顶部极简展陈导航 -->
  <header>
    <div class="logo en-text">MANUSCRIPT · GREEK_DENG</div>
    <div class="collection-name en-text">24/7 Continuous Streaming Literature</div>
  </header>

  <!-- 40vw 巨型半透明背景水印 -->
  <div class="watermark-bg en-text" id="watermark-bg">Ω</div>

  <!-- 流式长文核心排版区域 -->
  <main class="manuscript-wrapper">
    <article class="manuscript-article">
      
      <div class="article-header">
        <span class="manuscript-tag en-text">Exhibit No. 01 · Autonomous Stream</span>
        <h1 class="article-title">我在希腊蹬随机的句子。</h1>
        <p class="article-subtitle en-text">"Thoughts materialized, borders crossed. Continuous 24-hour literature generation."</p>
        <div class="title-divider"></div>
      </div>

      <!-- 实时生长的长文正文流 -->
      <div class="article-content" id="article-content">
        <!-- 首段与后续段落将由 JS 流式实时生长并注入 -->
        <p class="paragraph-block" id="active-paragraph">
          <span class="drop-cap" id="first-drop-cap">在</span><span id="text-flow-stream"></span><span class="type-cursor" id="type-cursor"></span>
        </p>
      </div>

    </article>
  </main>

  <!-- 底部固定实时状态栏 -->
  <footer class="manuscript-footer">
    <div class="status-left">
      <span class="live-dot"></span>
      <span id="stream-status">24/7 AUTONOMOUS STREAMING ACTIVE</span>
      <span class="word-counter en-text" id="word-counter">· 0 WORDS GENERATED</span>
    </div>
    <div class="status-right en-text">
      <span>SMOLLM2-360M BASE · PURE CHINESE STREAM</span>
    </div>
  </footer>

  <script type="module" src="js/gallery.js"></script>
</body>
</html>
